<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mint header Instagram story</title>
<style>body,h1,h2,h3{font-kerning:normal;letter-spacing:-0.01em}
  html, body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #1E0032;
  }
  .story {
    width: 1080px;
    height: 1920px;
    background:
      radial-gradient(ellipse 110% 100% at 100% 0%, #5A19A5 28%, #5A19A500 85%),
      radial-gradient(ellipse 90% 105% at 0% 100%, #00A59B 0%, #00A59B 25%, #00A59B00 72%),
      radial-gradient(ellipse 80% 95% at 100% 100%, #9CDCE7 0%, #9CDCE7 22%, #9CDCE700 67%),
      #1E0032;
  }
</style>
</head>
<body>
  <div class="story"></div>
</body>
</html>
